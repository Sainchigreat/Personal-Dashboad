name: Momentum OS CI

on:
  pull_request:
    branches:
      - 'arena/**'
      - 'feature/**'
      - main
  push:
    branches:
      - 'arena/**'
      - 'feature/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Type-check and production build
        run: npm run build
