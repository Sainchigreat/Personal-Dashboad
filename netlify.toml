# Momentum OS — Netlify build configuration (zero-cost free tier).
# SERVER-ONLY secrets are configured in Netlify UI:
#   Site configuration -> Environment variables
# Names only, never values, never committed:
#   DATABASE_URL         pooled PostgreSQL connection string from the existing
#                        Supabase "Momentum" project Connect panel.
#   MOMENTUM_PG_ROUTES   set to "enabled" ONLY once the Express route layer has
#                        been converted to the PostgreSQL backend.
#   NODE_ENV             "production" (enables Secure cookies + built client).
#   DATA_DIR             "/tmp/momentum-data" (ephemeral; not used once PG is active).
# Public browser values (safe, publishable only):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Never put DATABASE_URL, a DB password, or a service-role key in a VITE_ variable.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  node_bundler = "esbuild"

# API routing MUST precede the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
