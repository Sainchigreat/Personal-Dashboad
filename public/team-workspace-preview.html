<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum OS — Team Workspace</title>
<style>
:root{--bg:#090e19;--panel:#121c2d;--line:#26354d;--muted:#91a0b8;--txt:#edf3ff;--blue:#548cff;--green:#4bd0a4;--amber:#f0bc68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#1b2c50,transparent 40%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#0b1220;border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{font-size:17px;font-weight:800;padding:0 10px 28px}.mark{display:inline-grid;place-items:center;background:linear-gradient(135deg,#3479f6,#8868e9);width:30px;height:30px;border-radius:9px;margin-right:8px}.cap{font-size:10px;letter-spacing:1.5px;color:#7586a2;padding:0 10px 10px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#aab8ce;text-align:left;padding:12px;border-radius:9px}.nav button.active{background:#1a2c4c;color:white}.nav button:hover{background:#182640}main{padding:26px 34px;max-width:1500px;width:100%;margin:auto}.top,.head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:30px;color:var(--muted);font-size:12px}.role,select,input,textarea{background:#0d1728;border:1px solid #30405b;color:var(--txt);padding:9px 11px;border-radius:9px}.head{align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:10px;color:#82a9fa;letter-spacing:1.6px;font-weight:700}.head h1{font-size:28px;letter-spacing:-.8px;margin:7px 0}.head p{margin:0;color:var(--muted)}button{cursor:pointer;border:1px solid var(--line);background:#17243a;color:var(--txt);border-radius:9px;padding:9px 13px}.primary{background:linear-gradient(120deg,#3479f6,#6a8fff);border:0;font-weight:700}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.card{background:linear-gradient(180deg,#141f32,#101827);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.muted,.sub{color:var(--muted)}.muted{font-size:12px}.num{font-size:28px;font-weight:800;margin:9px 0 3px}.sub{font-size:11px}.two{grid-template-columns:1.35fr 1fr}.title{font-weight:700;margin-bottom:14px}.goal{margin:17px 0}.row{font-size:12px}.bar{height:7px;border-radius:9px;background:#29364d;margin:9px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3479f6,#8a8aff);border-radius:9px}.task,.member,.event{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #202d42}.task:last-child,.member:last-child,.event:last-child{border:0}.avatar{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#273b5d;color:#dceaff;font-size:10px;font-weight:800}.push{margin-left:auto}.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#26354c;color:#c4d3e8;white-space:nowrap}.green{background:#123b35;color:#8be3c5}.amber{background:#46361f;color:#f4cd86}.blue{background:#1c345c;color:#b2ccff}.red{background:#48262e;color:#ffaaaa}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;color:#8293ae;font-size:10px;text-transform:uppercase;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid #202d42}.table tr:last-child td{border:0}.callout{background:#142643;border:1px solid #304c75;border-radius:10px;padding:12px 14px;color:#c7d8f5;font-size:12px;line-height:1.5;margin-bottom:14px}.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);background:#131e30;border:1px solid #34445e;border-radius:16px;padding:22px}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#9eacc1}.field input,.field select,.field textarea{width:100%}.foot{font-size:10px;color:#7586a2;margin-top:12px}@media(max-width:850px){.app{grid-template-columns:68px 1fr}.side{padding:20px 8px}.brand{font-size:0;padding:0 9px 25px}.cap{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:attr(data-icon);font-size:18px}main{padding:20px}.two{grid-template-columns:1fr}}@media(max-width:580px){.app{display:block}.side{height:auto;position:sticky;z-index:5;width:100%;padding:7px;border-right:0;border-bottom:1px solid var(--line)}.brand,.cap{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:40px;padding:10px}.nav button:before{font-size:15px}main{padding:17px 12px}.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.num{font-size:23px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="mark">M</span>Momentum OS</div><div class="cap">Team workspace</div><nav class="nav" id="nav"><button class="active" data-page="overview" data-icon="◫">Overview</button><button data-page="goals" data-icon="◎">Team Goals</button><button data-page="tasks" data-icon="☷">Tasks</button><button data-page="scoreboard" data-icon="▤">Scoreboard</button><button data-page="members" data-icon="♧">Members</button><button data-page="activity" data-icon="◷">Activity</button></nav></aside><main><div class="top"><span>Momentum OS / <b id="crumb">Overview</b></span><span>Prototype · Sample data　<select class="role" id="role"><option>Owner</option><option>Manager</option><option>Member</option></select></span></div><div id="content"></div></main></div><div id="modal"></div>
<script>
const members=[{id:1,n:"Tobi A.",r:"Manager",i:"TA"},{id:2,n:"Maya O.",r:"Member",i:"MO"},{id:3,n:"Daniel K.",r:"Member",i:"DK"},{id:4,n:"Alex E.",r:"Member",i:"AE"}];
let goals=[{id:1,n:"Publish consistent brand content",d:"Build a reliable publishing rhythm.",v:12,t:20,u:"pieces",owner:"Tobi A.",due:"Nov 30"},{id:2,n:"Complete creative projects",d:"Deliver priority portfolio and campaign work.",v:5,t:8,u:"projects",owner:"Maya O.",due:"Nov 28"},{id:3,n:"Grow the YouTube library",d:"Publish useful creative education videos.",v:2,t:4,u:"videos",owner:"Daniel K.",due:"Nov 30"}];
let tasks=[{id:1,n:"Develop the November content calendar",a:1,p:"High",d:"2026-11-04",s:"Approved",g:1},{id:2,n:"Design carousel: creative direction principles",a:2,p:"High",d:"2026-11-05",s:"In Progress",g:1},{id:3,n:"Write and prepare weekly brand post",a:3,p:"Medium",d:"2026-11-06",s:"Submitted for Review",g:1},{id:4,n:"Create campaign key visual concepts",a:2,p:"High",d:"2026-11-07",s:"In Progress",g:2},{id:5,n:"Prepare portfolio case study layout",a:4,p:"Medium",d:"2026-11-08",s:"Assigned",g:2},{id:6,n:"Edit and package YouTube tutorial",a:3,p:"Medium",d:"2026-11-10",s:"Revision Requested",g:3},{id:7,n:"Research references for next chapter",a:1,p:"Low",d:"2026-11-03",s:"Completed",g:1}];
let activity=[["Maya O.","moved a task to In Progress","Design carousel: creative direction principles","18 min ago"],["Daniel K.","submitted work for review","Write and prepare weekly brand post","1 hour ago"],["Tobi A.","updated team goal progress","Publish consistent brand content · 12/20","3 hours ago"],["Owner","assigned a new task","Research references for next chapter","Yesterday"]];
let page="overview",role="Owner",sf="All",mf="All";const can=()=>role!=="Member",who=id=>members.find(x=>x.id==id)?.n||"Unassigned",sc=s=>["Approved","Completed"].includes(s)?"green":s==="In Progress"?"blue":s==="Submitted for Review"?"amber":s==="Revision Requested"?"red":"";
function head(k,t,d,act=""){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><div>${act}</div></div>`}
function prog(v,t){return `<div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`}
function goal(g){return `<div class="goal"><div class="row"><b>${g.n}</b><b>${Math.round(g.v/g.t*100)}%</b></div><div class="sub">${g.d}</div>${prog(g.v,g.t)}<div class="row sub"><span>${g.v}/${g.t} ${g.u} · Owner ${g.owner}</span><span>Due ${g.due}</span></div></div>`}
function met(p){let a=tasks.filter(t=>t.a===p.id),done=a.filter(t=>["Approved","Completed"].includes(t.s)).length,ip=a.filter(t=>t.s==="In Progress").length,rev=a.filter(t=>t.s==="Submitted for Review").length,late=a.filter(t=>t.d<"2026-11-02"&&!["Approved","Completed"].includes(t.s)).length;return {a,done,ip,rev,late,score:done*15+rev*8+ip*5}}
function events(){return activity.map(e=>`<div class="event"><div class="avatar">${e[0].split(" ").map(x=>x[0]).join("")}</div><div><b>${e[0]}</b> ${e[1]}<div class="sub">${e[2]}</div></div><span class="sub push">${e[3]}</span></div>`).join("")}
function board(){return `<div class="card"><div class="title">Team contribution <span class="muted">· based on task records</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Score</th><th>Approved</th><th>In progress</th><th>Overdue</th><th>Awaiting review</th><th>Activity</th></tr></thead><tbody>${members.map(p=>{let m=met(p),state=m.late?"Needs attention":m.ip||m.rev?"Active recently":"Quiet";return `<tr><td><b>${p.n}</b><div class="sub">${p.r}</div></td><td><b>${m.score} pts</b></td><td>${m.done}</td><td>${m.ip}</td><td>${m.late}</td><td>${m.rev}</td><td><span class="pill ${state==="Active recently"?"green":state==="Needs attention"?"amber":""}">${state}</span></td></tr>`}).join("")}</tbody></table></div><div class="foot">Prototype score: approved/completed = 15 points, submitted for review = 8, in progress = 5. Not a judgement of someone's value. Consider workload, complexity and blockers. Logins do not count as meaningful activity.</div></div>`}
function render(){document.getElementById("crumb").textContent=page[0].toUpperCase()+page.slice(1);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let c=document.getElementById("content"),done=tasks.filter(t=>["Approved","Completed"].includes(t.s)).length,ip=tasks.filter(t=>t.s==="In Progress").length,late=tasks.filter(t=>t.d<"2026-11-02"&&!["Approved","Completed"].includes(t.s)).length;
if(page==="overview")c.innerHTML=head("TEAM WORKSPACE","A clear view of the work ahead.","Shared goals, ownership and progress across the team.",`${can()?'<button class="primary" onclick="taskForm()">＋ Assign task</button> <button onclick="goalForm()">＋ New goal</button>':""}`)+`<div class="grid stats">${stat("Team goal progress","63%","Across 3 active goals")}${stat("Tasks completed",done,"Approved or completed")}${stat("In progress",ip,"Being worked on")}${stat("Needs attention",late,"Overdue assignments")}</div><div class="grid two"><div class="card"><div class="title">Team goals <button class="push" onclick="go('goals')">View all →</button></div>${goals.map(goal).join("")}</div><div class="card"><div class="title">Team activity <button class="push" onclick="go('activity')">View all →</button></div>${events()}</div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="title">Priority tasks</div>${tasks.filter(t=>t.p==="High").map(taskrow).join("")}</div><div class="card"><div class="title">Team at a glance</div>${members.map(p=>`<div class="member"><div class="avatar">${p.i}</div><b>${p.n}</b><span class="sub push">${met(p).a.length} assigned · ${met(p).done} approved</span></div>`).join("")}</div></div>`;
if(page==="goals")c.innerHTML=head("SHARED DIRECTION","Team goals","Everyone sees the outcomes we're working towards.",can()?'<button class="primary" onclick="goalForm()">＋ Create goal</button>':"")+ `<div class="callout">Team goals connect daily tasks to shared outcomes. Progress is visible to everyone; the owner and manager can create or edit goals.</div><div class="grid two">${goals.map(g=>`<div class="card">${goal(g)}<span class="sub">Owner: ${g.owner}</span> ${can()?`<button class="push" onclick="goalForm(${g.id})">Edit</button>`:""}</div>`).join("")}</div>`;
if(page==="tasks")c.innerHTML=head("WORK MANAGEMENT","Tasks & assignments","Assign work, clarify ownership and move deliverables through review.",can()?'<button class="primary" onclick="taskForm()">＋ Assign task</button>':"")+ `<div class="filters"><select onchange="sf=this.value;render()"><option>All</option>${["Assigned","In Progress","Submitted for Review","Revision Requested","Approved","Completed"].map(x=>`<option ${sf===x?"selected":""}>${x}</option>`).join("")}</select><select onchange="mf=this.value;render()"><option value="All">All members</option>${members.map(p=>`<option value="${p.id}" ${mf==p.id?"selected":""}>${p.n}</option>`).join("")}</select></div><div class="card tablewrap"><table class="table"><thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${tasks.filter(t=>(sf==="All"||t.s===sf)&&(mf==="All"||t.a==mf)).map(t=>`<tr><td><b>${t.n}</b><div class="sub">${goals.find(g=>g.id===t.g)?.n||""}</div></td><td>${who(t.a)}</td><td>${t.p}</td><td>${t.d}</td><td><span class="pill ${sc(t.s)}">${t.s}</span></td><td>${can()?`<button onclick="taskForm(${t.id})">Edit</button>`:`<button onclick="advance(${t.id})">Update</button>`}</td></tr>`).join("")}</tbody></table></div>`;
if(page==="scoreboard")c.innerHTML=head("TRANSPARENT ACCOUNTABILITY","Team scoreboard","A shared view of contribution, workload and delivery.")+`<div class="callout"><b>How to read this:</b> Score is a prototype calculation, not a judgement of value. Review workload, task complexity and blockers. A login alone never counts as contribution.</div>${board()}`;
if(page==="members")c.innerHTML=head("THE PEOPLE BEHIND THE WORK","Team members","See who is responsible for what and how work is distributed.",can()?'<button class="primary" onclick="invite()">＋ Invite member</button>':"")+`<div class="grid two">${members.map(p=>{let m=met(p);return `<div class="card"><div class="row"><div class="avatar">${p.i}</div><div><b>${p.n}</b><div class="sub">${p.r}</div></div><span class="pill ${m.ip||m.rev?"green":""} push">${m.ip||m.rev?"Active recently":"Quiet"}</span></div><div class="row" style="margin-top:20px"><span>${m.a.length} assigned</span><span>${m.done} approved</span><span>${m.late} overdue</span></div></div>`}).join("")}</div>`;
if(page==="activity")c.innerHTML=head("TEAM TRANSPARENCY","Activity","A timeline of meaningful work: assignments, updates, submissions and reviews.")+`<div class="card">${events()}</div>`}
function stat(l,n,f){return `<div class="card"><div class="muted">${l}</div><div class="num">${n}</div><div class="sub">${f}</div></div>`}
function taskrow(t){return `<div class="task"><div><b>${t.n}</b><div class="sub">${who(t.a)} · ${t.d}</div></div><span class="pill ${sc(t.s)} push">${t.s}</span></div>`}
function go(p){page=p;render()}document.getElementById("nav").onclick=e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)};document.getElementById("role").onchange=e=>{role=e.target.value;render()};
function show(title,desc,body,fn){document.getElementById("modal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)close()"><div class="modal"><h2>${title}</h2><p>${desc}</p>${body}<div class="row" style="justify-content:flex-end;margin-top:18px"><button onclick="close()">Cancel</button><button class="primary" onclick="${fn}">Save</button></div></div></div>`}function close(){document.getElementById("modal").innerHTML=""}
function taskForm(id){if(!can())return;let t=tasks.find(x=>x.id===id)||{n:"",a:2,p:"Medium",d:"2026-11-12",s:"Assigned",g:1};show(id?"Edit task":"Assign task","Choose an owner, deadline and linked goal.",`<div class="form"><div class="field full"><label>Task title</label><input id="tn" value="${t.n}"></div><div class="field"><label>Assignee</label><select id="ta">${members.map(p=>`<option value="${p.id}" ${p.id===t.a?"selected":""}>${p.n}</option>`).join("")}</select></div><div class="field"><label>Priority</label><select id="tp">${["Low","Medium","High"].map(p=>`<option ${p===t.p?"selected":""}>${p}</option>`).join("")}</select></div><div class="field"><label>Due date</label><input id="td" type="date" value="${t.d}"></div><div class="field"><label>Team goal</label><select id="tg">${goals.map(g=>`<option value="${g.id}" ${g.id===t.g?"selected":""}>${g.n}</option>`).join("")}</select></div></div>`,`saveTask(${id||0})`)}
function saveTask(id){let n=document.getElementById("tn").value.trim();if(!n)return alert("Enter a task title.");let t={id:id||Math.max(0,...tasks.map(x=>x.id))+1,n,a:+document.getElementById("ta").value,p:document.getElementById("tp").value,d:document.getElementById("td").value,g:+document.getElementById("tg").value,s:id?tasks.find(x=>x.id===id).s:"Assigned"};if(id)tasks=tasks.map(x=>x.id===id?t:x);else tasks.unshift(t);activity.unshift([role,id?"updated a task":"assigned a task",n,"Just now"]);close();render()}
function advance(id){let t=tasks.find(x=>x.id===id),steps=["Assigned","In Progress","Submitted for Review","Revision Requested","Approved","Completed"],allowed=role==="Member"?["In Progress","Submitted for Review"]:steps;let n=steps.slice(steps.indexOf(t.s)+1).find(x=>allowed.includes(x));if(!n)return alert("No next status available in this role preview.");t.s=n;activity.unshift([who(t.a),"moved a task to "+n,t.n,"Just now"]);let g=goals.find(x=>x.id===t.g);if(g&&["Approved","Completed"].includes(n))g.v=Math.min(g.t,g.v+1);render()}
function goalForm(id){let g=goals.find(x=>x.id===id)||{n:"",d:"",v:0,t:10,u:"pieces",owner:"Tobi A.",due:"Nov 30"};show(id?"Edit goal":"Create team goal","Set a measurable outcome for the team.",`<div class="form"><div class="field full"><label>Goal title</label><input id="gn" value="${g.n}"></div><div class="field full"><label>Description</label><textarea id="gd">${g.d}</textarea></div><div class="field"><label>Target</label><input id="gt" type="number" value="${g.t}"></div><div class="field"><label>Unit</label><input id="gu" value="${g.u}"></div><div class="field"><label>Owner</label><select id="go">${members.map(p=>`<option ${p.n===g.owner?"selected":""}>${p.n}</option>`).join("")}</select></div><div class="field"><label>Due</label><input id="gdu" value="${g.due}"></div></div>`,`saveGoal(${id||0})`)}
function saveGoal(id){let n=document.getElementById("gn").value.trim();if(!n)return alert("Enter a goal title.");let g={id:id||Math.max(0,...goals.map(x=>x.id))+1,n,d:document.getElementById("gd").value,t:+document.getElementById("gt").value,u:document.getElementById("gu").value,v:id?goals.find(x=>x.id===id).v:0,owner:document.getElementById("go").value,due:document.getElementById("gdu").value};if(id)goals=goals.map(x=>x.id===id?g:x);else goals.push(g);activity.unshift([role,id?"updated a goal":"created a goal",n,"Just now"]);close();render()}
function invite(){show("Invite team member","Prototype only — no email will be sent.",`<div class="form"><div class="field"><label>Name</label><input id="in" placeholder="Jordan A."></div><div class="field"><label>Email</label><input id="ie" type="email" placeholder="name@example.com"></div><div class="field full"><label>Role</label><select id="ir"><option>Member</option><option>Manager</option></select></div></div>`,"saveInvite()")}
function saveInvite(){let n=document.getElementById("in").value.trim(),e=document.getElementById("ie").value;if(!n||!e.includes("@"))return alert("Enter a name and valid email.");members.push({id:Math.max(0,...members.map(x=>x.id))+1,n,r:document.getElementById("ir").value,i:n.split(" ").map(x=>x[0]).join("").toUpperCase()});activity.unshift([role,"added a team member",n,"Just now"]);close();render()}
render();
</script></body></html>
